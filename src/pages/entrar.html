<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <p class="brand"><svg class="logo-icone" viewBox="0 0 48 44" width="30" height="30" aria-hidden="true"><g transform="rotate(-2 24 34)"><rect x="4" y="30" width="40" height="8" rx="3" fill="#A9C77A"/></g><g transform="rotate(1.5 24 25)"><rect x="8" y="21" width="32" height="7" rx="3" fill="#E9A9BE"/></g><g transform="translate(9 3)"><path d="M15 2 L15 20 Q8 17 1 20 L1 4 Q8 1 15 2 Z" fill="#FBF3E7" stroke="#4B2318" stroke-width="1.6" stroke-linejoin="round"/><path d="M15 2 L15 20 Q22 17 29 20 L29 4 Q22 1 15 2 Z" fill="#FBF3E7" stroke="#4B2318" stroke-width="1.6" stroke-linejoin="round"/></g><path d="M40 4l1.6 4L46 9.6l-4.4 1.6L40 15l-1.6-4.4L34 9.6l4.4-1.6Z" fill="#5E7A32"/><path d="M4 18l1.2 3L8 22.2l-2.8 1L4 26l-1.2-2.8L0 22.2l2.8-1Z" fill="#4B2318"/></svg><span class="ink">Ink</span><span class="circle">Circle</span></p>
      <nav class="primary-nav" aria-label="Navegação principal">
        <ul>
          <li><a href="index.html">Avaliações</a></li>
          <li><a href="busca.html">Descobrir</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <a href="entrar.html" aria-current="page">Entrar</a>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">

      <div class="auth-layout">

        <figure class="auth-ilustracao" aria-hidden="true">
          <svg viewBox="0 0 280 240" width="100%" role="presentation">
            <ellipse cx="140" cy="205" rx="95" ry="14" fill="#E9A9BE" opacity="0.35"/>

            <g transform="rotate(-3 140 190)">
              <rect x="40" y="172" width="200" height="30" rx="7" fill="#A9C77A"/>
            </g>
            <g transform="rotate(2 140 160)">
              <rect x="55" y="142" width="180" height="28" rx="7" fill="#E9A9BE"/>
            </g>
            <g transform="rotate(-1.5 140 132)">
              <rect x="65" y="114" width="160" height="26" rx="7" fill="#BFDCE8"/>
            </g>

            <g transform="translate(70 40)">
              <path d="M70 12 L70 96 Q40 82 4 96 L4 20 Q40 6 70 12 Z" fill="#FBF3E7" stroke="#4B2318" stroke-width="2.2" stroke-linejoin="round"/>
              <path d="M70 12 L70 96 Q100 82 136 96 L136 20 Q100 6 70 12 Z" fill="#FBF3E7" stroke="#4B2318" stroke-width="2.2" stroke-linejoin="round"/>
              <path d="M14 26 Q40 16 62 24" fill="none" stroke="#C9A48A" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M14 42 Q40 32 62 40" fill="none" stroke="#C9A48A" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M14 58 Q40 48 60 55" fill="none" stroke="#C9A48A" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M78 24 Q100 16 126 26" fill="none" stroke="#C9A48A" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M78 40 Q100 32 126 42" fill="none" stroke="#C9A48A" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M80 55 Q100 48 126 58" fill="none" stroke="#C9A48A" stroke-width="1.6" stroke-linecap="round"/>
            </g>

            <path d="M226 46l3.4 8.6L238 58l-8.6 3.4L226 70l-3.4-8.6L214 58l8.6-3.4Z" fill="#5E7A32"/>
            <path d="M44 96l2.4 6L52.4 104l-6 2.4L44 112.4l-2.4-6L35.6 104.4l6-2.4Z" fill="#4B2318"/>
            <circle cx="234" cy="100" r="4" fill="#E9A9BE"/>
            <circle cx="30" cy="60" r="3.2" fill="#A9C77A"/>
          </svg>
        </figure>

        <div class="auth-formulario">
          <h1>Bem-vinda de volta</h1>

          <nav class="abas-auth" aria-label="Alternar entre login e cadastro">
            <a href="entrar.html" aria-current="true">Entrar</a>
            <a href="criar-conta.html">Criar conta</a>
          </nav>

          <form class="card-form" action="#" method="post">
            <div class="campo">
              <label for="login-email">E-mail</label>
              <input type="email" id="login-email" name="email" required autocomplete="email">
            </div>
            <div class="campo">
              <label for="login-senha">Senha</label>
              <input type="password" id="login-senha" name="senha" required autocomplete="current-password">
            </div>
            <div class="acoes-form">
              <button type="submit">Entrar</button>
              <a href="#">Esqueci minha senha</a>
            </div>
          </form>

          <p style="margin-top: 1.25rem; font-size: 0.9rem;">
            Ainda não tem conta? <a href="criar-conta.html">Criar conta</a>
          </p>
        </div>

      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p><span class="ink">Ink</span><span class="circle">Circle</span> — projeto da disciplina TCS1</p>
      <p><a href="index.html">Voltar ao início</a></p>
    </div>
  </footer>

</body>
</html>
