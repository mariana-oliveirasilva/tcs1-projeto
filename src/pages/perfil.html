<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil de Ana Cavalcante — InkCircle</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="wrap">
      <p class="brand"><svg class="logo-icone" viewBox="0 0 48 44" width="30" height="30" aria-hidden="true"><g transform="rotate(-2 24 34)"><rect x="4" y="30" width="40" height="8" rx="3" fill="#A9C77A"/></g><g transform="rotate(1.5 24 25)"><rect x="8" y="21" width="32" height="7" rx="3" fill="#E9A9BE"/></g><g transform="translate(9 3)"><path d="M15 2 L15 20 Q8 17 1 20 L1 4 Q8 1 15 2 Z" fill="#FBF3E7" stroke="#4B2318" stroke-width="1.6" stroke-linejoin="round"/><path d="M15 2 L15 20 Q22 17 29 20 L29 4 Q22 1 15 2 Z" fill="#FBF3E7" stroke="#4B2318" stroke-width="1.6" stroke-linejoin="round"/></g><path d="M40 4l1.6 4L46 9.6l-4.4 1.6L40 15l-1.6-4.4L34 9.6l4.4-1.6Z" fill="#5E7A32"/><path d="M4 18l1.2 3L8 22.2l-2.8 1L4 26l-1.2-2.8L0 22.2l2.8-1Z" fill="#4B2318"/></svg><span class="ink">Ink</span><span class="circle">Circle</span></p>
      <nav class="primary-nav" aria-label="Navegação principal">
        <ul>
          <li><a href="index.html">Avaliações</a></li>
          <li><a href="busca.html">Descobrir</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <a href="perfil.html" aria-current="page">Meu perfil</a>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
    </div>

    <figure class="perfil-banner" role="img" aria-label="Foto de capa de uma estante de livros"></figure>

    <div class="wrap">
      <p id="estado-perfil" role="status" aria-live="polite">Carregando perfil…</p>
      <p id="entrar-perfil" hidden><a class="botao" href="entrar.html">Entrar na minha conta</a></p>

      <div class="perfil-bloco" id="dados-perfil" hidden>
        <div class="perfil-avatar-quadrado" id="perfil-iniciais" aria-hidden="true"></div>
        <div class="perfil-acoes">
          <a href="avaliacao.html" class="botao">Nova avaliação</a>
          <button class="botao secundario" id="sair-perfil" type="button">Sair</button>
        </div>
        <div class="perfil-info">
          <h1 id="perfil-nome"></h1>
          <p class="usuario" id="perfil-usuario"></p>
          <p id="perfil-total"></p>
        </div>
      </div>

      <section id="secao-avaliacoes-perfil" aria-labelledby="titulo-avaliacoes-perfil" hidden>
        <h2 id="titulo-avaliacoes-perfil" class="titulo-icone">
          <span class="icone-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="#4B2318" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5c2-1 5-1 7 0v14c-2-1-5-1-7 0V5Z"/><path d="M22 5c-2-1-5-1-7 0v14c2-1 5-1 7 0V5Z"/></svg>
          </span>
          Avaliações publicadas
        </h2>
        <hr class="divisor-ondulado" aria-hidden="true">
        <p id="perfil-sem-avaliacoes" hidden>Você ainda não publicou avaliações.</p>
        <div class="feed" id="lista-avaliacoes-perfil"></div>
      </section>



    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p><span class="ink">Ink</span><span class="circle">Circle</span> — projeto da disciplina TCS1</p>
      <p><a href="index.html">Voltar ao início</a></p>
    </div>
  </footer>

  <script type="module" src="../js/main.js"></script>
</body>
</html>
